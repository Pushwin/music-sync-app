<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🎵 Harmony Sync - Zero Delay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      z-index: 2;
      text-align: center;
      padding: 40px;
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
    }

    .subtitle {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #e0e0e0;
      font-weight: 300;
    }

    .now-playing {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .song-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ff6b6b;
      margin-bottom: 5px;
    }

    .song-artist {
      font-size: 0.9rem;
      color: #b0b0b0;
    }

    audio {
      width: 100%;
      margin-bottom: 25px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.3);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .control-btn {
      padding: 15px 25px;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .control-btn.secondary {
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      box-shadow: 0 10px 25px rgba(78, 205, 196, 0.3);
    }

    .control-btn.secondary:hover {
      box-shadow: 0 15px 35px rgba(78, 205, 196, 0.4);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 15px;
      justify-content: center;
    }

    .volume-icon {
      font-size: 1.2rem;
      color: #ff6b6b;
    }

    .volume-slider {
      width: 120px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
    }

    .disc-container {
      margin: 30px 0;
      display: flex;
      justify-content: center;
    }

    .disc {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #333 30%, #666 40%, #222 70%, #111 100%);
      border: 3px solid #ff6b6b;
      position: relative;
      animation: spin 3s linear infinite paused;
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
    }

    .disc.playing {
      animation-play-state: running;
    }

    .disc::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #ff6b6b;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 0.95rem;
      color: #e0e0e0;
      opacity: 0.8;
      font-style: italic;
      margin-top: 20px;
    }

    .sync-status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .sync-excellent { color: #00ff88; }
    .sync-good { color: #4ecdc4; }
    .sync-poor { color: #ff6b6b; }

    .latency-info {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.7rem;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .admin-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      color: #000;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .user-badge {
      display: inline-block;
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      color: #fff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .song-library {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 5px 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .song-item:hover {
      background: rgba(255, 107, 107, 0.1);
      transform: translateX(5px);
    }

    .song-item.selected {
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid rgba(255, 107, 107, 0.5);
    }

    .song-info {
      text-align: left;
    }

    .song-info h4 {
      color: #ff6b6b;
      margin-bottom: 3px;
    }

    .song-info p {
      color: #b0b0b0;
      font-size: 0.8rem;
    }

    .connection-status {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.8rem;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .connected { color: #00ff88; }
    .disconnected { color: #ff6b6b; }

    .file-upload {
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
    }

    .upload-btn {
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
        margin: 20px;
      }

      h1 {
        font-size: 2.2rem;
      }

      .controls {
        gap: 15px;
      }

      .control-btn {
        padding: 12px 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Connection status indicator -->
  <div class="connection-status">
    <span id="connectionStatus" class="disconnected">🔴 Connecting...</span>
  </div>

  <!-- Sync status indicator -->
  <div class="sync-status">
    <span id="syncStatus" class="sync-good">● Syncing...</span>
  </div>

  <!-- Latency info -->
  <div class="latency-info">
    <div>RTT: <span id="rttDisplay">--</span>ms</div>
    <div>Offset: <span id="offsetDisplay">--</span>ms</div>
    <div>Users: <span id="userCount">--</span></div>
  </div>

  <div class="container">
    <!-- Role badge -->
    <div id="roleBadge" style="display: none;"></div>

    <h1>⚡ Harmony Sync</h1>
    <p class="subtitle">Zero-Delay Synchronized Music Experience</p>

    <!-- Song Library (Admin only) -->
    <div id="songLibrary" class="song-library" style="display: none;">
      <h3 style="color: #ff6b6b; margin-bottom: 15px;">🎵 Song Library</h3>
      <div id="songList"></div>
    </div>

    <!-- Now Playing -->
    <div class="now-playing">
      <div class="song-title" id="songTitle">Select a song to get started</div>
      <div class="song-artist" id="songArtist">Harmony Sync</div>
    </div>

    <!-- Audio Player -->
    <audio id="audio" controls preload="auto"></audio>

    <!-- Controls -->
    <div class="controls">
      <button id="playBtn" class="control-btn" style="display: none;">
        ⚡ Play
      </button>
      <button id="pauseBtn" class="control-btn" style="display: none;">
        ⏸️ Pause
      </button>
      <button id="syncBtn" class="control-btn secondary" style="display: none;">
        🔄 Force Sync
      </button>
    </div>

    <!-- File Upload (Admin only) -->
    <div id="fileUpload" class="file-upload" style="display: none;">
      <h4 style="color: #4ecdc4; margin-bottom: 10px;">📁 Upload New Song</h4>
      <input type="file" id="fileInput" accept="audio/*" style="margin-bottom: 10px;">
      <button id="uploadBtn" class="upload-btn">Upload Song</button>
    </div>

    <!-- Volume Control -->
    <div class="volume-container">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7" />
    </div>

    <!-- Spinning Disc -->
    <div class="disc-container">
      <div id="disc" class="disc"></div>
    </div>

    <p class="status" id="statusText">
      🔗 Connecting to Harmony Sync server...
    </p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Ultra low latency configuration
    const socket = io({
      transports: ['websocket'],
      upgrade: false,
      pingTimeout: 5000,
      pingInterval: 2000
    });

    // DOM elements
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const syncBtn = document.getElementById("syncBtn");
    const audio = document.getElementById("audio");
    const volumeSlider = document.getElementById("volumeSlider");
    const disc = document.getElementById("disc");
    const statusText = document.getElementById("statusText");
    const syncStatus = document.getElementById("syncStatus");
    const connectionStatus = document.getElementById("connectionStatus");
    const roleBadge = document.getElementById("roleBadge");
    const rttDisplay = document.getElementById("rttDisplay");
    const offsetDisplay = document.getElementById("offsetDisplay");
    const userCount = document.getElementById("userCount");
    const songTitle = document.getElementById("songTitle");
    const songArtist = document.getElementById("songArtist");
    const songLibrary = document.getElementById("songLibrary");
    const songList = document.getElementById("songList");
    const fileUpload = document.getElementById("fileUpload");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");

    // State variables
    let isAdmin = false;
    let timeOffset = 0;
    let avgRTT = 0;
    let rttHistory = [];
    let offsetHistory = [];
    let connectedUsers = 0;
    let currentSong = null;
    let songs = [];
    let selectedSongId = null;

    // High precision timing
    const getHighPrecisionTime = () => {
      return performance.now() + (performance.timeOrigin % 1);
    };

    const sleep = (ms) => {
      return new Promise(resolve => {
        if (ms <= 0) {
          resolve();
          return;
        }
        
        if (ms < 16) {
          const start = performance.now();
          const frame = () => {
            if (performance.now() - start >= ms) {
              resolve();
            } else {
              requestAnimationFrame(frame);
            }
          };
          requestAnimationFrame(frame);
        } else {
          setTimeout(resolve, ms);
        }
      });
    };

    // Clock synchronization
    async function performPrecisionSync() {
      const samples = [];
      const SAMPLE_COUNT = 5;
      
      for (let i = 0; i < SAMPLE_COUNT; i++) {
        const start = getHighPrecisionTime();
        
        const response = await new Promise(resolve => {
          socket.emit("ultraPingTime", start);
          socket.once("ultraPongTime", (serverNow, clientStart) => {
            const end = getHighPrecisionTime();
            resolve({ serverNow, clientStart, end });
          });
        });
        
        const rtt = response.end - response.clientStart;
        const serverTimeAtReceive = response.serverNow + (rtt / 2);
        const offset = serverTimeAtReceive - response.end;
        
        samples.push({ rtt, offset });
        
        if (i < SAMPLE_COUNT - 1) {
          await sleep(10);
        }
      }
      
      const rtts = samples.map(s => s.rtt);
      const offsets = samples.map(s => s.offset);
      
      rtts.sort((a, b) => a - b);
      offsets.sort((a, b) => a - b);
      
      const medianRTT = rtts[Math.floor(rtts.length / 2)];
      const medianOffset = offsets[Math.floor(offsets.length / 2)];
      
      rttHistory.push(medianRTT);
      offsetHistory.push(medianOffset);
      
      if (rttHistory.length > 10) {
        rttHistory.shift();
        offsetHistory.shift();
      }
      
      timeOffset = medianOffset;
      avgRTT = medianRTT;
      
      // Update display
      rttDisplay.textContent = avgRTT.toFixed(1);
      offsetDisplay.textContent = timeOffset.toFixed(1);
      
      // Update sync quality
      if (avgRTT < 15) {
        syncStatus.textContent = '⚡ Ultra Sync';
        syncStatus.className = 'sync-excellent';
      } else if (avgRTT < 50) {
        syncStatus.textContent = '● Good Sync';
        syncStatus.className = 'sync-good';
      } else {
        syncStatus.textContent = '⚠ Poor Sync';
        syncStatus.className = 'sync-poor';
      }
    }

    // Ultra-precise playback scheduling
    async function scheduleUltraLowLatencyPlayback(serverTime, audioTime = 0) {
      const localTargetTime = serverTime - timeOffset;
      const now = getHighPrecisionTime();
      const delay = localTargetTime - now;

      // Sync audio time
      if (Math.abs(audio.currentTime - audioTime) > 0.01) {
        audio.currentTime = audioTime;
      }

      console.log(`🎵 Scheduling playback: delay=${delay.toFixed(2)}ms, audioTime=${audioTime.toFixed(3)}s`);

      if (delay > 1) {
        await sleep(delay - 0.5);
        
        const finalCheck = () => {
          const remainingDelay = (serverTime - timeOffset) - getHighPrecisionTime();
          if (remainingDelay <= 0.5) {
            audio.play().then(() => {
              disc.classList.add('playing');
              console.log(`✅ Playback started with ${remainingDelay.toFixed(2)}ms precision`);
            });
          } else {
            requestAnimationFrame(finalCheck);
          }
        };
        requestAnimationFrame(finalCheck);
        
      } else if (delay > -50) {
        audio.play().then(() => {
          disc.classList.add('playing');
          console.log(`✅ Immediate playback (${delay.toFixed(2)}ms)`);
        });
      } else {
        console.log(`⚠ Playback too late: ${delay.toFixed(2)}ms`);
        audio.play().then(() => {
          disc.classList.add('playing');
        });
      }
    }

    // Song library management
    function updateSongLibrary() {
      songList.innerHTML = '';
      songs.forEach(song => {
        const songItem = document.createElement('div');
        songItem.className = `song-item ${selectedSongId === song.id ? 'selected' : ''}`;
        songItem.innerHTML = `
          <div class="song-info">
            <h4>${song.title}</h4>
            <p>${song.artist} • ${song.duration || 'Unknown'}</p>
          </div>
          <button onclick="selectSong(${song.id})" style="background: none; border: 1px solid #ff6b6b; color: #ff6b6b; padding: 5px 10px; border-radius: 15px; cursor: pointer;">
            ${selectedSongId === song.id ? '✓ Selected' : 'Select'}
          </button>
        `;
        songList.appendChild(songItem);
      });
    }

    function selectSong(songId) {
      if (!isAdmin) return;
      
      selectedSongId = songId;
      const song = songs.find(s => s.id === songId);
      if (!song) return;

      // Update local display
      songTitle.textContent = song.title;
      songArtist.textContent = song.artist;
      audio.src = song.url;
      
      // Notify server and other clients
      socket.emit("songChange", {
        title: song.title,
        artist: song.artist,
        url: song.url
      });

      updateSongLibrary();
      statusText.textContent = `🎵 Selected: ${song.title} by ${song.artist}`;
    }

    // File upload
    uploadBtn.onclick = async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a file first');
        return;
      }

      const formData = new FormData();
      formData.append('songFile', file);
      formData.append('title', prompt('Song title:') || file.name);
      formData.append('artist', prompt('Artist name:') || 'Unknown Artist');

      try {
        const response = await fetch('/upload-song', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const result = await response.json();
          statusText.textContent = '✅ Song uploaded successfully!';
          fileInput.value = '';
        } else {
          statusText.textContent = '❌ Upload failed';
        }
      } catch (error) {
        console.error('Upload error:', error);
        statusText.textContent = '❌ Upload error';
      }
    };

    // Volume control
    volumeSlider.oninput = (e) => {
      audio.volume = e.target.value;
    };

    // Button handlers
    playBtn.onclick = async () => {
      if (!isAdmin) return;
      
      const localNow = getHighPrecisionTime();
      const serverNow = localNow + timeOffset;
      const networkCompensation = Math.max(avgRTT * 0.6, 10);
      const playAtServer = serverNow + networkCompensation;

      console.log(`🚀 Admin triggering play: network_compensation=${networkCompensation.toFixed(1)}ms`);

      socket.emit("ultraPlayAt", {
        serverTimestamp: playAtServer,
        audioTime: audio.currentTime,
      });

      await scheduleUltraLowLatencyPlayback(playAtServer, audio.currentTime);
    };

    pauseBtn.onclick = () => {
      if (!isAdmin) return;
      socket.emit("ultraPause");
      audio.pause();
      disc.classList.remove('playing');
      console.log("⏸️ Admin paused playback");
    };

    syncBtn.onclick = () => {
      performPrecisionSync();
      statusText.textContent = '🔄 Forcing synchronization...';
    };

    // Socket event handlers
    socket.on('connect', () => {
      console.log("🔗 Connected to server");
      connectionStatus.innerHTML = '<span class="connected">🟢 Connected</span>';
      statusText.textContent = '🎵 Connected to Harmony Sync!';
      
      // Start synchronization
      performPrecisionSync();
      setInterval(performPrecisionSync, 2000);
    });

    socket.on('disconnect', () => {
      console.log("❌ Disconnected from server");
      connectionStatus.innerHTML = '<span class="disconnected">🔴 Disconnected</span>';
      statusText.textContent = '❌ Disconnected from server';
      syncStatus.textContent = '❌ Disconnected';
      syncStatus.className = 'sync-poor';
    });

    socket.on("youAreAdmin", () => {
      isAdmin = true;
      playBtn.style.display = "inline-block";
      pauseBtn.style.display = "inline-block";
      syncBtn.style.display = "inline-block";
      songLibrary.style.display = "block";
      fileUpload.style.display = "block";
      roleBadge.innerHTML = '<div class="admin-badge">👑 ADMIN - You control the music!</div>';
      roleBadge.style.display = "block";
      statusText.textContent = "👑 You are the admin! Control music playback for everyone.";
    });

    socket.on("youAreNotAdmin", () => {
      isAdmin = false;
      playBtn.style.display = "none";
      pauseBtn.style.display = "none";
      songLibrary.style.display = "none";
      fileUpload.style.display = "none";
      roleBadge.innerHTML = '<div class="user-badge">🎧 LISTENER - Enjoy the music!</div>';
      roleBadge.style.display = "block";
      statusText.textContent = "🎧 You're listening! The admin controls the music.";
    });

    socket.on("songsUpdated", (songData) => {
      songs = songData;
      updateSongLibrary();
      console.log(`🎵 Updated song library: ${songs.length} songs`);
    });

    socket.on("songChange", (songData) => {
      songTitle.textContent = songData.title;
      songArtist.textContent = songData.artist;
      if (songData.url) {
        audio.src = songData.url;
      }
      console.log(`🎵 Song changed: ${songData.title} by ${songData.artist}`);
    });

    socket.on("ultraPlayAt", async ({ serverTimestamp, audioTime }) => {
      if (!isAdmin) { // Only non-admins receive this
        await scheduleUltraLowLatencyPlayback(serverTimestamp, audioTime);
      }
    });

    socket.on("ultraPause", () => {
      if (!isAdmin) { // Only non-admins receive this  
        audio.pause();
        disc.classList.remove('playing');
        console.log("⏸️ Received pause command");
      }
    });

    // Audio events
    audio.addEventListener('play', () => {
      disc.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      disc.classList.remove('playing');
    });

    audio.addEventListener('canplaythrough', () => {
      console.log("✅ Audio ready for playback");
    });

    audio.addEventListener('error', (e) => {
      console.error('Audio error:', e);
      statusText.textContent = '⚠️ Error loading audio file';
    });

    // Keyboard shortcuts for admin
    document.addEventListener('keydown', (e) => {
      if (!isAdmin) return;
      
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        if (audio.paused) {
          playBtn.click();
        } else {
          pauseBtn.click();
        }
      }
    });

    // Set default audio
    audio.volume = volumeSlider.value;
    audio.preload = "auto";

    // Initialize
    console.log("🎵 Harmony Sync Client Initialized");
  </script>
</body>
</html>
