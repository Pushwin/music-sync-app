<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🎵 Harmony Sync - Zero Delay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      z-index: 2;
      text-align: center;
      padding: 40px;
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
    }

    .subtitle {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #e0e0e0;
      font-weight: 300;
    }

    .now-playing {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .song-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ff6b6b;
      margin-bottom: 5px;
    }

    .song-artist {
      font-size: 0.9rem;
      color: #b0b0b0;
    }

    audio {
      width: 100%;
      margin-bottom: 25px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.3);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .control-btn {
      padding: 15px 25px;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 15px;
      justify-content: center;
    }

    .volume-icon {
      font-size: 1.2rem;
      color: #ff6b6b;
    }

    .volume-slider {
      width: 120px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
    }

    .disc-container {
      margin: 30px 0;
      display: flex;
      justify-content: center;
    }

    .disc {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #333 30%, #666 40%, #222 70%, #111 100%);
      border: 3px solid #ff6b6b;
      position: relative;
      animation: spin 3s linear infinite paused;
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
    }

    .disc.playing {
      animation-play-state: running;
    }

    .disc::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #ff6b6b;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 0.95rem;
      color: #e0e0e0;
      opacity: 0.8;
      font-style: italic;
      margin-top: 20px;
    }

    .sync-status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .sync-excellent { color: #00ff88; }
    .sync-good { color: #4ecdc4; }
    .sync-poor { color: #ff6b6b; }

    .latency-info {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.7rem;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .admin-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      color: #000;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
        margin: 20px;
      }

      h1 {
        font-size: 2.2rem;
      }

      .controls {
        gap: 15px;
      }

      .control-btn {
        padding: 12px 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Sync status indicator -->
  <div class="sync-status">
    <span id="syncStatus" class="sync-good">● Syncing...</span>
  </div>

  <!-- Latency info -->
  <div class="latency-info">
    <div>RTT: <span id="rttDisplay">--</span>ms</div>
    <div>Offset: <span id="offsetDisplay">--</span>ms</div>
    <div>Jitter: <span id="jitterDisplay">--</span>ms</div>
  </div>

  <div class="container">
    <div id="adminBadge" class="admin-badge" style="display: none;">
      👑 ADMIN CONTROLS - ULTRA LOW LATENCY MODE
    </div>

    <h1>⚡ Harmony Sync</h1>
    <p class="subtitle">Zero-Delay Synchronized Music Experience</p>

    <!-- Now Playing -->
    <div class="now-playing">
      <div class="song-title" id="songTitle">Ultra Low Latency Test Track</div>
      <div class="song-artist" id="songArtist">Precision Audio Labs</div>
    </div>

    <!-- Audio Player -->
    <audio id="audio" controls preload="auto"></audio>

    <!-- Controls -->
    <div class="controls">
      <button id="playBtn" class="control-btn" style="display: none;">
        ⚡ Instant Play
      </button>
      <button id="pauseBtn" class="control-btn" style="display: none;">
        ⏸️ Pause
      </button>
    </div>

    <!-- Volume Control -->
    <div class="volume-container">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7" />
    </div>

    <!-- Spinning Disc -->
    <div class="disc-container">
      <div id="disc" class="disc"></div>
    </div>

    <p class="status" id="statusText">
      ⚡ Ultra low latency mode active. Target: &lt;10ms sync precision
    </p>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    // Ultra low latency configuration
    const socket = io({
      transports: ['websocket'], // Force WebSocket for lowest latency
      upgrade: false,
      pingTimeout: 5000,
      pingInterval: 2000
    });

    // DOM elements
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const audio = document.getElementById("audio");
    const volumeSlider = document.getElementById("volumeSlider");
    const disc = document.getElementById("disc");
    const statusText = document.getElementById("statusText");
    const syncStatus = document.getElementById("syncStatus");
    const adminBadge = document.getElementById("adminBadge");
    const rttDisplay = document.getElementById("rttDisplay");
    const offsetDisplay = document.getElementById("offsetDisplay");
    const jitterDisplay = document.getElementById("jitterDisplay");

    // Ultra low latency variables
    let isAdmin = false;
    let timeOffset = 0;
    let avgRTT = 0;
    let jitter = 0;
    let syncQuality = 'syncing';
    let rttHistory = [];
    let offsetHistory = [];

    // Set test audio (replace with your audio URL)
    audio.src = "https://media.vocaroo.com/mp3/13vvld8kQ12W";
    audio.volume = volumeSlider.value;
    audio.preload = "auto";

    // Ultra-precise timing functions
    const getHighPrecisionTime = () => {
      return performance.now() + (performance.timeOrigin % 1);
    };

    const sleep = (ms) => {
      return new Promise(resolve => {
        if (ms <= 0) {
          resolve();
          return;
        }
        
        // Use requestAnimationFrame for sub-millisecond precision
        if (ms < 16) {
          const start = performance.now();
          const frame = () => {
            if (performance.now() - start >= ms) {
              resolve();
            } else {
              requestAnimationFrame(frame);
            }
          };
          requestAnimationFrame(frame);
        } else {
          setTimeout(resolve, ms);
        }
      });
    };

    // Enhanced clock synchronization with multiple samples
    async function performPrecisionSync() {
      const samples = [];
      const SAMPLE_COUNT = 10;
      
      for (let i = 0; i < SAMPLE_COUNT; i++) {
        const start = getHighPrecisionTime();
        
        const response = await new Promise(resolve => {
          socket.emit("ultraPingTime", start);
          socket.once("ultraPongTime", (serverNow, clientStart) => {
            const end = getHighPrecisionTime();
            resolve({ serverNow, clientStart, end });
          });
        });
        
        const rtt = response.end - response.clientStart;
        const serverTimeAtReceive = response.serverNow + (rtt / 2);
        const offset = serverTimeAtReceive - response.end;
        
        samples.push({ rtt, offset });
        
        // Small delay between samples to avoid overwhelming
        if (i < SAMPLE_COUNT - 1) {
          await sleep(5);
        }
      }
      
      // Calculate statistics
      const rtts = samples.map(s => s.rtt);
      const offsets = samples.map(s => s.offset);
      
      // Use median for better accuracy (less affected by outliers)
      rtts.sort((a, b) => a - b);
      offsets.sort((a, b) => a - b);
      
      const medianRTT = rtts[Math.floor(rtts.length / 2)];
      const medianOffset = offsets[Math.floor(offsets.length / 2)];
      
      // Update history for jitter calculation
      rttHistory.push(medianRTT);
      offsetHistory.push(medianOffset);
      
      if (rttHistory.length > 20) {
        rttHistory.shift();
        offsetHistory.shift();
      }
      
      // Calculate jitter (standard deviation of RTT)
      if (rttHistory.length > 1) {
        const avgRTTLocal = rttHistory.reduce((a, b) => a + b) / rttHistory.length;
        const variance = rttHistory.reduce((sum, rtt) => sum + Math.pow(rtt - avgRTTLocal, 2), 0) / rttHistory.length;
        jitter = Math.sqrt(variance);
      }
      
      // Apply offset
      timeOffset = medianOffset;
      avgRTT = medianRTT;
      
      // Update display
      rttDisplay.textContent = avgRTT.toFixed(1);
      offsetDisplay.textContent = timeOffset.toFixed(1);
      jitterDisplay.textContent = jitter.toFixed(1);
      
      // Update sync status
      if (avgRTT < 10 && jitter < 2) {
        syncQuality = 'excellent';
        syncStatus.textContent = '⚡ Ultra Sync';
        syncStatus.className = 'sync-excellent';
      } else if (avgRTT < 25 && jitter < 5) {
        syncQuality = 'good';
        syncStatus.textContent = '● Good Sync';
        syncStatus.className = 'sync-good';
      } else {
        syncQuality = 'poor';
        syncStatus.textContent = '⚠ Poor Sync';
        syncStatus.className = 'sync-poor';
      }
      
      console.log(`🎯 Sync: RTT=${avgRTT.toFixed(1)}ms, Offset=${timeOffset.toFixed(1)}ms, Jitter=${jitter.toFixed(1)}ms`);
    }

    // Ultra-precise playback scheduling
    async function scheduleUltraLowLatencyPlayback(serverTime, audioTime = 0) {
      const localTargetTime = serverTime - timeOffset;
      const now = getHighPrecisionTime();
      const delay = localTargetTime - now;

      // Sync audio time with minimal tolerance
      if (Math.abs(audio.currentTime - audioTime) > 0.001) { // 1ms tolerance
        audio.currentTime = audioTime;
      }

      console.log(`🎵 Scheduling playback: delay=${delay.toFixed(2)}ms, audioTime=${audioTime.toFixed(3)}s`);

      if (delay > 1) {
        // For delays > 1ms, use precise sleep
        await sleep(delay - 0.5); // Pre-position 0.5ms early
        
        // Final precise timing
        const finalCheck = () => {
          const remainingDelay = (serverTime - timeOffset) - getHighPrecisionTime();
          if (remainingDelay <= 0.5) {
            audio.play().then(() => {
              disc.classList.add('playing');
              console.log(`✅ Playback started with ${remainingDelay.toFixed(2)}ms precision`);
            });
          } else {
            requestAnimationFrame(finalCheck);
          }
        };
        requestAnimationFrame(finalCheck);
        
      } else if (delay > -10) {
        // Immediate play for small delays or slight lateness
        audio.play().then(() => {
          disc.classList.add('playing');
          console.log(`✅ Immediate playback (${delay.toFixed(2)}ms)`);
        });
      } else {
        console.log(`⚠ Playback too late: ${delay.toFixed(2)}ms`);
        audio.play().then(() => {
          disc.classList.add('playing');
        });
      }
    }

    // Volume control
    volumeSlider.oninput = (e) => {
      audio.volume = e.target.value;
    };

    // Admin setup
    socket.on("youAreAdmin", () => {
      isAdmin = true;
      playBtn.style.display = "inline-block";
      pauseBtn.style.display = "inline-block";
      adminBadge.style.display = "inline-block";
      statusText.innerHTML = "⚡ You control ultra-low latency playback! Target: <10ms sync precision";
    });

    socket.on("youAreNotAdmin", () => {
      isAdmin = false;
      statusText.innerHTML = "⚡ Ultra low latency mode. Sync precision: <10ms";
    });

    // Ultra-precise play button
    playBtn.onclick = async () => {
      if (!isAdmin) return;
      
      const localNow = getHighPrecisionTime();
      const serverNow = localNow + timeOffset;
      
      // Minimal delay - just enough for network transmission
      const networkCompensation = Math.max(avgRTT * 0.6, 5); // 60% of RTT or 5ms minimum
      const playAtServer = serverNow + networkCompensation;

      console.log(`🚀 Admin triggering ultra-low latency play: network_compensation=${networkCompensation.toFixed(1)}ms`);

      socket.emit("ultraPlayAt", {
        serverTimestamp: playAtServer,
        audioTime: audio.currentTime,
      });

      await scheduleUltraLowLatencyPlayback(playAtServer, audio.currentTime);
    };

    // Pause button
    pauseBtn.onclick = () => {
      if (!isAdmin) return;
      socket.emit("ultraPause");
      audio.pause();
      disc.classList.remove('playing');
      console.log("⏸️ Admin paused playback");
    };

    // Socket events
    socket.on("ultraPlayAt", async ({ serverTimestamp, audioTime }) => {
      await scheduleUltraLowLatencyPlayback(serverTimestamp, audioTime);
    });

    socket.on("ultraPause", () => {
      audio.pause();
      disc.classList.remove('playing');
      console.log("⏸️ Received pause command");
    });

    // Audio events
    audio.addEventListener('play', () => {
      disc.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      disc.classList.remove('playing');
    });

    audio.addEventListener('canplaythrough', () => {
      console.log("✅ Audio ready for ultra-low latency playback");
    });

    audio.addEventListener('error', (e) => {
      console.error('Audio error:', e);
      statusText.textContent = '⚠️ Error loading audio file';
    });

    // Start ultra-precise synchronization
    const startUltraSyncMode = async () => {
      console.log("🎯 Starting ultra-low latency sync mode...");
      
      // Initial sync
      await performPrecisionSync();
      
      // Continuous high-frequency sync
      setInterval(async () => {
        await performPrecisionSync();
      }, 1000); // Every 1 second for ultra-precision
      
      // Micro-adjustments every 100ms
      setInterval(() => {
        if (rttHistory.length > 5) {
          const recentRTT = rttHistory.slice(-5).reduce((a, b) => a + b) / 5;
          const recentOffset = offsetHistory.slice(-5).reduce((a, b) => a + b) / 5;
          
          // Small adjustment if drift detected
          const drift = Math.abs(recentOffset - timeOffset);
          if (drift > 0.5) {
            timeOffset = recentOffset;
            console.log(`🔧 Micro-adjustment: drift=${drift.toFixed(2)}ms`);
          }
        }
      }, 100);
    };

    // Initialize when connected
    socket.on('connect', () => {
      console.log("🔗 Connected to ultra-low latency server");
      startUltraSyncMode();
    });

    socket.on('disconnect', () => {
      console.log("❌ Disconnected from server");
      syncStatus.textContent = '❌ Disconnected';
      syncStatus.className = 'sync-poor';
    });

    // Keyboard shortcuts for admin
    document.addEventListener('keydown', (e) => {
      if (!isAdmin) return;
      
      if (e.code === 'Space') {
        e.preventDefault();
        if (audio.paused) {
          playBtn.click();
        } else {
          pauseBtn.click();
        }
      }
    });

    // Performance monitoring
    let performanceStats = {
      playLatencies: [],
      syncDrifts: []
    };

    setInterval(() => {
      if (performanceStats.playLatencies.length > 0) {
        const avgLatency = performanceStats.playLatencies.reduce((a, b) => a + b) / performanceStats.playLatencies.length;
        console.log(`📊 Avg play latency: ${avgLatency.toFixed(2)}ms`);
        performanceStats.playLatencies = [];
      }
    }, 10000);
  </script>
</body>
</html>
